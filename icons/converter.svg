<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A tight viewBox keeps the exchange arrows legible at Firefox toolbar size. -->
  <style>
    .tile { fill: #0b1f3d; stroke: #3d6fb6; stroke-width: 2; }
    .arrow { stroke: #a9c9ff; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #12325e; stroke: #2b62aa; }
      .arrow { stroke: #eaf3ff; }
    }
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="14"/>
  <g class="arrow" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 21h32m-9-9 10 9-10 9"/>
    <path d="M50 43H18m9-9-10 9 10 9"/>
  </g>
</svg>
